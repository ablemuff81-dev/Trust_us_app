<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0d0d" />
  <meta name="color-scheme" content="light dark" />
  <script>
    // Apply the saved light/dark choice before first paint, so the app never
    // flashes dark for visitors who picked light mode.
    (function () {
      try {
        var stored = localStorage.getItem("truste-us.theme");
        var theme =
          stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        var root = document.documentElement;
        root.setAttribute("data-theme", theme);
        root.classList.toggle("dark", theme === "dark");
      } catch (error) {
        // storage unavailable — the app falls back to its dark default
      }
    })();
  </script>
  <meta
    name="description"
    content="Trust Us tracks wallet expenses in Malagasy ariary (MGA): calendar view, detailed statement, offline-first storage, six languages."
  />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Trust Us" />
  <title>Trust Us — Wallet expenses in MGA</title>
</head>


<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
